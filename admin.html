<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Loja</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="img/logo_redondo.png" type="image/x-icon">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: #bf7577;
    --bg-deep: #c39fa0;
    --accent: #b8192d;
    --ink: #3a2115;
    --cream: #f7ece4;
    --card: #f9f1ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 220% at 12% 0%, var(--bg-deep) 0%, var(--bg) 45%, var(--bg) 100%);
    min-height: 100vh;
  }
  h1, h2 { font-family: 'Fraunces', serif; margin: 0; }
  .topbar {
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(58,33,21,0.14);
  }
  .topbar h1 { font-size: 22px; font-weight: 600; }
  .topbar .amp { color: var(--accent); font-style: italic; font-weight: 500; }
  #logoutBtn {
    display: none;
    background: transparent;
    border: 1px solid rgba(58,33,21,0.3);
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
  }
  #logoutBtn:hover { background: var(--accent); border-color: var(--accent); color: var(--cream); }

  main { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }

  #loginBox {
    background: var(--card);
    border-radius: 18px;
    padding: 36px 32px;
    box-shadow: 0 8px 24px rgba(58,33,21,0.12);
    max-width: 380px;
    margin: 60px auto 0;
  }
  #loginBox h2 { font-size: 20px; margin-bottom: 6px; }
  #loginBox p.sub { margin: 0 0 22px; opacity: .65; font-size: 13.5px; }

  label { display: block; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; opacity: .6; margin-bottom: 6px; }
  input, select {
    width: 100%;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid rgba(58,33,21,0.2);
    background: #fff;
    font-family: 'Jost', sans-serif;
    font-size: 14.5px;
    margin-bottom: 16px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.primary {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: 14.5px;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
  }
  button.primary:hover { opacity: .92; transform: translateY(-1px); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }

  #loginError { color: var(--accent); font-size: 13px; margin-top: 10px; min-height: 18px; }


  #panel { display: none; }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 8px 24px rgba(58,33,21,0.1);
    margin-bottom: 24px;
  }
  .card h2 { font-size: 19px; margin-bottom: 18px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  textarea {
    width: 100%;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid rgba(58,33,21,0.2);
    font-family: 'Jost', sans-serif;
    font-size: 14.5px;
    margin-bottom: 16px;
    resize: vertical;
    min-height: 70px;
  }

  .tamanhos-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tamanho-chip {
    position: relative;
  }
  .tamanho-chip input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .tamanho-chip label {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid rgba(58,33,21,0.25);
    background: #fff;
    font-size: 13.5px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    margin: 0;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tamanho-chip input:checked + label {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--cream);
  }

  .upload-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .upload-btn {
    display: inline-flex;
    align-items: center;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(58,33,21,0.25);
    background: #fff;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
    margin: 0;
    transition: background .15s ease, color .15s ease;
  }
  .upload-btn:hover { background: var(--accent); color: var(--cream); border-color: var(--accent); }
  .upload-filename { font-size: 13px; opacity: .6; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview-thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; box-shadow: 0 2px 8px rgba(58,33,21,0.2); }

  #formMsg { font-size: 13px; min-height: 18px; margin-top: 4px; }
  #formMsg.ok { color: #2e7d32; }
  #formMsg.err { color: var(--accent); }

  .produto-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(58,33,21,0.1);
  }
  .produto-item:last-child { border-bottom: none; }
  .produto-item img {
    width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #e5d6d2; flex-shrink: 0;
  }
  .produto-info { flex: 1; min-width: 0; }
  .produto-info strong { display: block; font-size: 14.5px; }
  .produto-info span.meta { font-size: 12.5px; opacity: .65; display: block; }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(184,25,45,0.1);
    color: var(--accent);
    margin-right: 4px;
  }
  .produto-preco { font-weight: 600; color: var(--accent); white-space: nowrap; }
  .del-btn {
    background: none; border: none; cursor: pointer; opacity: .5; font-size: 13px;
    padding: 6px 10px; border-radius: 8px;
  }
  .del-btn:hover { opacity: 1; background: rgba(184,25,45,0.1); color: var(--accent); }

  #emptyState { font-size: 13.5px; opacity: .6; padding: 8px 0; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Loja — Admin</h1>
  <button id="logoutBtn">Sair</button>
</div>

<main>

  <div id="loginBox">
    <h2>Área restrita</h2>
    <p class="sub">Acesso exclusivo para administração do site.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="admin@exemplo.com" />
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••" />
    <button class="primary" id="loginBtn">Entrar</button>
    <div id="loginError"></div>
  </div>

  <!-- PAINEL (só aparece depois do login) -->
  <div id="panel">
    <div class="card">
      <h2>Cadastrar peça</h2>
      <form id="produtoForm">
        <label for="nome">Nome da peça</label>
        <input id="nome" required placeholder="Ex: Camisa Linho Manga Longa" />

        <div class="row2">
          <div>
            <label for="categoria">Categoria</label>
            <select id="categoria" required>
              <option value="">Selecione</option>
              <option value="Camisas">Camisas</option>
              <option value="Blusas">Blusas</option>
              <option value="Calças">Calças</option>
              <option value="Shorts">Shorts</option>
            </select>
          </div>
          <div>
            <label for="cor">Cor</label>
            <input id="cor" placeholder="Ex: Azul marinho" />
          </div>
        </div>

        <label>Tamanhos disponíveis</label>
        <div class="tamanhos-group" id="tamanhosGroup">
          <div class="tamanho-chip"><input type="checkbox" id="tam-PP" value="PP"><label for="tam-PP">PP</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-P" value="P"><label for="tam-P">P</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-M" value="M"><label for="tam-M">M</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-G" value="G"><label for="tam-G">G</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-GG" value="GG"><label for="tam-GG">GG</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-XG" value="XG"><label for="tam-XG">XG</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-UN" value="Único"><label for="tam-UN">Ún.</label></div>
        </div>
        
        <div style="display: none;" class="tamanhos-group" id="tamanhosNumeros">
          <div class="tamanho-chip"><input type="checkbox" id="tam-36" value="36"><label for="tam-36">36</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-38" value="38"><label for="tam-38">38</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-40" value="40"><label for="tam-40">40</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-42" value="42"><label for="tam-42">42</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-44" value="44"><label for="tam-44">44</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-46" value="46"><label for="tam-46">46</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-48" value="48"><label for="tam-48">48</label></div>
          <div class="tamanho-chip"><input type="checkbox" id="tam-50" value="50"><label for="tam-50">50</label></div>
        </div>

        <div class="row2">
          <div>
            <label for="preco">Preço (R$)</label>
            <input id="preco" required type="number" step="0.01" min="0" placeholder="0,00" />
          </div>
          <div>
            <label for="estoque">Estoque (un.)</label>
            <input id="estoque" type="number" step="1" min="0" placeholder="0" />
          </div>
        </div>

        <label>Foto do produto</label>
        <div class="upload-row">
          <label class="upload-btn" for="imagem">Escolher do dispositivo</label>
          <input type="file" id="imagem" accept="image/*" style="display:none" />
          <span id="uploadFileName" class="upload-filename">Nenhuma imagem selecionada</span>
          <img id="previewImg" class="preview-thumb" style="display:none" alt="Pré-visualização" />
        </div>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" placeholder="Tecido, corte, detalhes da peça..."></textarea>

        <button class="primary" type="submit">Salvar peça</button>
        <div id="formMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2>Peças cadastradas</h2>
      <div id="listaProdutos"><div id="emptyState">Carregando...</div></div>
    </div>
  </div>
  
</main>

<script>

  document.getElementById('categoria').addEventListener('change', (e) => {
    const categoriasComNumero = ['Calças', 'Shorts'];
    const usaNumero = categoriasComNumero.includes(e.target.value);
    document.getElementById('tamanhosNumeros').style.display = usaNumero ? 'flex' : 'none';
    document.getElementById('tamanhosGroup').style.display = usaNumero ? 'none' : 'flex';
    const grupoEscondido = usaNumero
      ? document.getElementById('tamanhosGroup')
      : document.getElementById('tamanhosNumeros');
    grupoEscondido.querySelectorAll('input:checked').forEach(input => {
      input.checked = false;
    });
  });

  document.getElementById('produtoForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    msg.textContent = '';
    msg.className = '';

    const nome = document.getElementById('nome').value.trim();
    const categoria = document.getElementById('categoria').value;
    const cor = document.getElementById('cor').value.trim();
    const preco = parseFloat(document.getElementById('preco').value);
    const estoque = parseInt(document.getElementById('estoque').value) || 0;
    const arquivoImagem = document.getElementById('imagem').files[0];
    const descricao = document.getElementById('descricao').value.trim();

    const tamanhos = Array.from(document.querySelectorAll('#tamanhosGroup input:checked, #tamanhosNumeros input:checked'))
      .map(input => input.value);

  });
  
  const firebaseConfig = {
    apiKey: "AIzaSyAjcZc1q0lSON9zeFzp5E_uZpX5_pkORjI",
    authDomain: "cravo-e-canela-55adb.firebaseapp.com",
    projectId: "cravo-e-canela-55adb",
    storageBucket: "cravo-e-canela-55adb.firebasestorage.app",
    messagingSenderId: "352605165922",
    appId: "1:352605165922:web:ec0db36a5dd6ab1d9e343b"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  
  function redimensionarImagem(file, larguraMax = 800, qualidade = 0.72) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const escala = Math.min(1, larguraMax / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * escala;
          canvas.height = img.height * escala;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', qualidade));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }


  document.getElementById('imagem').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const nomeSpan = document.getElementById('uploadFileName');
    const preview = document.getElementById('previewImg');
    if (!file) {
      nomeSpan.textContent = 'Nenhuma imagem selecionada';
      preview.style.display = 'none';
      return;
    } 
    nomeSpan.textContent = file.name;
    const reader = new FileReader();
    reader.onload = (ev) => {
      preview.src = ev.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  const loginBox = document.getElementById('loginBox');
  const panel = document.getElementById('panel');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginError = document.getElementById('loginError');


  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    loginError.textContent = '';
    auth.signInWithEmailAndPassword(email, senha)
      .catch(err => {
        loginError.textContent = 'Email ou senha inválidos.';
      });
  });

  logoutBtn.addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged(user => {
    if (user) {
      loginBox.style.display = 'none';
      panel.style.display = 'block';
      logoutBtn.style.display = 'inline-block';
      carregarProdutos();
    } else {
      loginBox.style.display = 'block';
      panel.style.display = 'none';
      logoutBtn.style.display = 'none';
    }
  });

  // ---- CADASTRAR PEÇA ----
  document.getElementById('produtoForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    msg.textContent = '';
    msg.className = '';

    const nome = document.getElementById('nome').value.trim();
    const categoria = document.getElementById('categoria').value;
    const cor = document.getElementById('cor').value.trim();
    const preco = parseFloat(document.getElementById('preco').value);
    const estoque = parseInt(document.getElementById('estoque').value) || 0;
    const arquivoImagem = document.getElementById('imagem').files[0];
    const descricao = document.getElementById('descricao').value.trim();

    const tamanhos = Array.from(document.querySelectorAll('#tamanhosGroup input:checked, #tamanhosNumeros input:checked'))
      .map(input => input.value);

    if (!nome || isNaN(preco) || !categoria) {
      msg.textContent = 'Preencha ao menos nome, categoria e preço.';
      msg.className = 'err';
      return;
    }

    submitBtn.disabled = true;
    let imagemURL = '';

    try {
      if (arquivoImagem) {
        msg.textContent = 'Processando imagem...';
        imagemURL = await redimensionarImagem(arquivoImagem);
        // trava de segurança: documento do Firestore tem limite de 1MB
        if (imagemURL.length > 900000) {
          msg.textContent = 'Essa imagem ainda ficou grande demais. Tente outra foto ou uma com menos resolução.';
          msg.className = 'err';
          submitBtn.disabled = false;
          return;
        }
      }


      msg.textContent = 'Salvando peça...';
      await db.collection('produtos').add({
        nome, categoria, cor, preco, estoque, tamanhos, imagem: imagemURL, descricao,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });

      msg.textContent = 'Peça salva com sucesso!';
      msg.className = 'ok';
      e.target.reset();
      document.getElementById('uploadFileName').textContent = 'Nenhuma imagem selecionada';
      document.getElementById('previewImg').style.display = 'none';
    } catch (err) {
      msg.textContent = 'Erro ao salvar: ' + err.message;
      msg.className = 'err';
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ---- LISTAR / APAGAR PEÇAS ----
  function carregarProdutos() {
    db.collection('produtos').orderBy('criadoEm', 'desc').onSnapshot(snapshot => {
      const lista = document.getElementById('listaProdutos');
      if (snapshot.empty) {
        lista.innerHTML = '<div id="emptyState">Nenhuma peça cadastrada ainda.</div>';
        return;
      }
      lista.innerHTML = '';
      snapshot.forEach(doc => {
        const p = doc.data();
        const tamanhosTxt = (p.tamanhos && p.tamanhos.length) ? p.tamanhos.join(' · ') : 'sem tamanho definido';
        const item = document.createElement('div');
        item.className = 'produto-item';
        item.innerHTML = `
          <img src="${p.imagem || ''}" onerror="this.style.visibility='hidden'" />
          <div class="produto-info">
            <strong>${p.nome}</strong>
            <span class="meta">
              ${p.categoria ? `<span class="badge">${p.categoria}</span>` : ''}
              ${p.cor ? p.cor + ' · ' : ''}${tamanhosTxt} · estoque: ${p.estoque ?? 0}
            </span>
          </div>
          <div class="produto-preco">R$ ${Number(p.preco).toFixed(2)}</div>
          <button class="del-btn" data-id="${doc.id}">Apagar</button>
        `;
        item.querySelector('.del-btn').addEventListener('click', async () => {
          if (confirm('Apagar "' + p.nome + '"?')) {
            await db.collection('produtos').doc(doc.id).delete();
          }
        });
        lista.appendChild(item);
      });
    });
  }
</script>
</body>
</html>
