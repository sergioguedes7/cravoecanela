<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cravo & Canela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="img/logo_redondo.png" type="image/x-icon">
<link rel="stylesheet" href="static/index.css">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

</head>
<body>


<div class="cc-header-wrap">
  <header class="cc-header">
    <div class="cc-brand">
      <img class="cc-logo" src="img/logo_redondo.png" alt="cc-logo">
      <span class="cc-tagline">A moda do jeito que você gosta!</span>
    </div>

    <h1 class="cc-name">
      Cravo <span class="cc-amp">&amp;</span> Canela
      <svg class="cc-name-swirl" viewBox="0 0 84 10" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M2 6.5C16 -1 30 11 42 5.5C54 0 66 9 82 3.5" stroke="#b8192d" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </h1>

    <div class="cc-links">
      <a class="cc-link" href="https://instagram.com/cravoecanelabjl" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/>
        </svg>
        <span class="cc-link-label">Instagram</span>
      </a>
      <a class="cc-link" href="https://wa.me/5577999280496" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
        <img class="logo_whatsapp" src="img/logo_whatsapp.png" alt="">
        <span class="cc-link-label">WhatsApp</span>
      </a>
      <a class="cc-link" href="sobre-nos.html" rel="noopener noreferrer" aria-label="WhatsApp">
        <img class="logo_whatsapp" src="img/logo_sobrenos.png" alt="">
        <span class="cc-link-label">Sobre</span>
      </a>
      <a class="cc-link" href="admin.html" rel="noopener noreferrer" aria-label="WhatsApp">
        <img class="logo_whatsapp" src="img/logo_login.png" alt="">
        <span class="cc-link-label"></span>
      </a>
    </div>
  </header>
</div>

<section class="cc-catalogo">
  <h2>Nossa coleção</h2>
  <p class="subtitulo">Camisas, blusas, calças, vestidos e shorts — feitos pra durar.</p>
  <div class="cc-filtros" id="filtros"></div>
  <div class="cc-grid" id="grid"><p class="cc-empty">Carregando peças...</p></div>
</section>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAjcZc1q0lSON9zeFzp5E_uZpX5_pkORjI",
    authDomain: "cravo-e-canela-55adb.firebaseapp.com",
    projectId: "cravo-e-canela-55adb",
    storageBucket: "cravo-e-canela-55adb.firebasestorage.app",
    messagingSenderId: "352605165922",
    appId: "1:352605165922:web:ec0db36a5dd6ab1d9e343b"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const NUMERO_WHATSAPP = '5577999280496';
  function linkWhatsApp(p) {
    const linhas = [
      'Olá! Tenho interesse nesta peça:',
      '',
      `*${p.nome}*`,
      p.categoria ? `Categoria: ${p.categoria}` : null,
      p.cor ? `Cor: ${p.cor}` : null,
      (p.tamanhos && p.tamanhos.length) ? `Tamanhos disponíveis: ${p.tamanhos.join(', ')}` : null,
      `Preço: R$ ${Number(p.preco).toFixed(2)}`,
      '',
      'Poderia me ajudar?'
    ].filter(Boolean).join('\n');

    return `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(linhas)}`;
  }

  let todasPecas = [];

  function renderGrid(pecas) {
    const grid = document.getElementById('grid');
    if (pecas.length === 0) {
      grid.innerHTML = '<p class="cc-empty">Nenhuma peça encontrada.</p>';
      return;
    }
    grid.innerHTML = '';
    pecas.forEach(p => {
      const tamanhosHtml = (p.tamanhos || []).map(t => `<span>${t}</span>`).join('');
      const semEstoque = (p.estoque ?? 0) <= 0;
      grid.innerHTML += `
        <div class="cc-produto">
          <img src="${p.imagem || ''}" onerror="this.style.visibility='hidden'" />
          <div class="info">
            <div class="categoria">${p.categoria || ''}</div>
            <strong>${p.nome}</strong>
            <div class="cor">${p.cor || ''}</div>
            <div class="cc-tamanhos">${tamanhosHtml}</div>
            <div class="preco">R$ ${Number(p.preco).toFixed(2)}</div>
            ${semEstoque ? '<div class="cc-sem-estoque">Fora de estoque</div>' : ''}
            <a class="cc-btn-whatsapp" href="${linkWhatsApp(p)}" target="_blank" rel="noopener noreferrer">
              <img src="img/logo_whatsapp.png" alt="WhatsApp" />
              Comprar no WhatsApp
            </a>
          </div>
        </div>`;
    });
  }

  function renderFiltros(categorias) {
    const filtros = document.getElementById('filtros');
    const botoes = ['Todos', ...categorias];
    filtros.innerHTML = botoes.map((c, i) =>
      `<button class="cc-filtro-btn ${i === 0 ? 'ativo' : ''}" data-cat="${c}">${c}</button>`
    ).join('');
    filtros.querySelectorAll('.cc-filtro-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filtros.querySelectorAll('.cc-filtro-btn').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        const cat = btn.dataset.cat;
        renderGrid(cat === 'Todos' ? todasPecas : todasPecas.filter(p => p.categoria === cat));
      });
    });
  }


  db.collection('produtos').orderBy('criadoEm', 'desc').get().then(snapshot => {
    todasPecas = snapshot.docs.map(doc => doc.data());
    const categorias = [...new Set(todasPecas.map(p => p.categoria).filter(Boolean))];
    renderFiltros(categorias);
    renderGrid(todasPecas);
  }).catch(err => {
    document.getElementById('grid').innerHTML = '<p class="cc-empty">Não foi possível carregar as peças agora.</p>';
    console.error(err);
  });
</script>
</body>
</html>
